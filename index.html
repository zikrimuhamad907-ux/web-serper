<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Muhamad Fardhan Azdzikri</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .header {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            padding: 35px 20px 25px;
            color: #fff;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #f0f4f8;
            color: #1e3c72;
            font-size: 40px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            border: 4px solid #ffd700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 25px 20px 30px;
        }

        .info-item {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px 18px;
            margin-bottom: 15px;
            border-left: 5px solid #2a5298;
            text-align: left;
            transition: background 0.2s;
        }

        .info-item:hover {
            background: #eef2f7;
        }

        .icon {
            font-size: 24px;
            margin-right: 15px;
            width: 30px;
            text-align: center;
        }

        .info-text h3 {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .info-text p {
            font-size: 16px;
            font-weight: 600;
            color: #1e3c72;
        }

        .footer {
            background: #f1f3f6;
            padding: 15px;
            font-size: 12px;
            color: #777;
            border-top: 1px solid #e0e0e0;
        }

        .footer span {
            color: #2a5298;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Header dengan avatar dan nama -->
        <div class="header">
            <div class="avatar">MF</div>
            <h1>Muhamad Fardhan Azdzikri</h1>
            <p>Siswa SMKN 4 Payakumbuh</p>
        </div>

        <!-- Konten informasi -->
        <div class="content">
            <div class="info-item">
                <div class="icon">👤</div>
                <div class="info-text">
                    <h3>Nama Lengkap</h3>
                    <p>Muhamad Fardhan Azdzikri</p>
                </div>
            </div>

            <div class="info-item">
                <div class="icon">🏫</div>
                <div class="info-text">
                    <h3>Kelas</h3>
                    <p>11 TKJ 1</p>
                </div>
            </div>

            <div class="info-item">
                <div class="icon">📍</div>
                <div class="info-text">
                    <h3>Sekolah</h3>
                    <p>SMKN 4 Payakumbuh</p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            Dibuat dengan <span>❤️</span> untuk profil siswa
        </div>
    </div>

</body>
</html>
